name: Playwright Java CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Run live storefront tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      BASE_URL: https://ecomcicid.netlify.app
      HEADLESS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Project with Maven
        run: mvn -B clean compile --no-transfer-progress

      - name: Install Playwright Browsers
        run: mvn -B exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run Playwright Tests
        run: mvn -B test --no-transfer-progress

      - name: Publish Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: |
            target/surefire-reports/
            target/*.png
          if-no-files-found: ignore
          retention-days: 7
